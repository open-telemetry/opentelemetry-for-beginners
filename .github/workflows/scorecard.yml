name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 10 * * 2' # weekly at 10:47 (UTC) on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    permissions:
      contents: read # for actions/checkout
      id-token: write # for Scorecard to publish results
      security-events: write # for the SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/scorecard.yml@117fd4566ba1caa91248c987e827f3a668043ea7 # v0.15.0
