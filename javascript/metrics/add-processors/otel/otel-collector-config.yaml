receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Add/modify resource-level attributes (applies to both traces and metrics)
  resource:
    attributes:
      - key: deployment.environment.name
        value: local
        action: insert
      - key: host.arch
        action: delete
      - key: host.id
        action: delete
      - key: host.name
        action: delete
      - key: process.command
        action: delete
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.owner
        action: delete
      - key: process.pid
        action: delete

  # Modify span attributes (for traces)
  attributes/traces:
    actions:
      - key: user_agent.original
        action: delete
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
      - key: server.port
        action: delete
      - key: network.peer.port
        action: delete

  # Drop metrics we don't need to reduce telemetry volume
  filter/exclude_metrics:
    error_mode: ignore
    metrics:
      metric:
        # Drop a low-level V8 internal metric most apps don't need.
        # The per-heap-space physical size is deep engine detail. The
        # useful memory signal (v8js.memory.heap.used) stays.
        - 'name == "v8js.memory.heap.space.physical_size"'

exporters:
  debug:
    verbosity: detailed

  # Jaeger receives our traces. Batching is handled here at the exporter
  # level (sending_queue.batch) instead of a standalone batch processor.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      sizer: items
      batch:
        flush_timeout: 5s
        min_size: 512

  # Prometheus scrapes the Collector (pull-based), so there's nothing to batch
  # on the way out. No batch processor and no sending_queue on this exporter.
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, attributes/traces]
      exporters: [debug, otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [resource, filter/exclude_metrics]
      exporters: [debug, prometheus]