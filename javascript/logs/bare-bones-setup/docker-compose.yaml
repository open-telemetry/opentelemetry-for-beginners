services:
  jaeger:
    image: jaegertracing/all-in-one:latest@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # Jaeger grpc (optional)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_GRPC_PORT: 4317

  prometheus:
    image: prom/prometheus:latest@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - ./otel/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"     # Prometheus UI
    depends_on:
      - otel-collector

  opensearch:
    image: opensearchproject/opensearch:latest@sha256:02358b2be62b268a404a54581184d027ac0dfa8f875be15fe4c4fa3f8884f464
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true        # no TLS/auth for local learning
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"     # OpenSearch REST API
      - "9600:9600"     # Performance Analyzer

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest@sha256:90e839fc7fb3ac80fbe87b0a08fe378ed9b7cb52fcbafa08840915f2b152bcf1
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"     # OpenSearch Dashboards UI
    depends_on:
      - opensearch

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8889:8889"     # Prometheus metrics endpoint
    depends_on:
      - jaeger
      - opensearch
